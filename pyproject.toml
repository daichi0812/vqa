[project]
name = "vqa"
version = "0.1.0"
description = "Visual Question Answering on the VizWiz 2023 dataset (DL Basic 2025 Competition)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv]
package = false
